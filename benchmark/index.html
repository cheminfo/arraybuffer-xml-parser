<script src="../dist/arraybuffer-xml-parser.umd.js"></script>

<script>
  async function doAll() {
    const response = await fetch('./big.xml');
    const data = await response.arrayBuffer();

    console.log(data);

    console.time('start');
    const result = XMLParser.parse(data, {
      ignoreAttributes: false,
      tagValueProcessor: (value) => value,
      attributeValueProcessor: (value) => value,
    });
    console.timeEnd('start');

    console.log(result);
  }

  doAll();
</script>
